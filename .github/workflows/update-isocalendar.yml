name: Update Contributions Calendar

on:
  schedule:
    # Chạy tự động mỗi ngày lúc 00:00 UTC (07:00 sáng giờ Việt Nam)
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-isocalendar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync latest main & generate 3D Contributions Calendar and Stats Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/generate_isocalendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/isocalendar.svg icons/github-stats.svg icons/streak-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub stats and 3D contributions calendar [skip ci]"
            git pull --rebase --autostash -X theirs origin main
            git push origin HEAD:main
          fi
